spring:
  mvc:
    problemdetails:
      enabled: true  # RFC 7807 错误响应格式
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:3GB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:3GB}
  application:
    name: xiyu-bid-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xiyu_bid_main}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}"
    username: ${DB_USERNAME:xiyu_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false  # 性能优化：禁止 Open-in-View
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration-mysql
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes TTL for dashboard cache
      cache-null-values: false
      key-prefix: "xiyu-bid:"
      use-key-prefix: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-empty-string-as-null-object: true
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

ai:
  provider: ${AI_PROVIDER:mock}  # Options: mock, openai
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5.2}
    timeout: ${OPENAI_TIMEOUT:PT30S}

app:
  version: ${project.version:1.0.3}
  crm:
    # Shared CRM binding for all profiles. Server env files inject XIYU_CRM_*;
    # profile-specific yml must not be the only place these mappings exist.
    base-url: ${XIYU_CRM_BASE_URL:}
    auth-base-url: ${XIYU_CRM_AUTH_BASE_URL:}
    customer-base-url: ${XIYU_CRM_CUSTOMER_BASE_URL:}
    message-base-url: ${XIYU_CRM_MESSAGE_BASE_URL:}
    chance-base-url: ${XIYU_CRM_CHANCE_BASE_URL:}
    contact-person-base-url: ${XIYU_CRM_CONTACT_PERSON_BASE_URL:}
    # CO-302 反查路径接口 25338/25259 部署在 CAC 服务上，与商机/客户接口不同 host
    cac-base-url: ${XIYU_CRM_CAC_BASE_URL:}
    client-id: ${XIYU_CRM_CLIENT_ID:}
    client-secret: ${XIYU_CRM_CLIENT_SECRET:}
    # 遗留配置：代码不再用配置账号登录 OSS 换 CRM token。
    # CRM 调用仅：用户登录 OSS token → generateToken → CRM JWT（见 CrmAuthService）。
    oauth-username: ${XIYU_CRM_OAUTH_USERNAME:}
    oauth-password: ${XIYU_CRM_OAUTH_PASSWORD:}
    generate-token-path: ${XIYU_CRM_GENERATE_TOKEN_PATH:/common/inner/generateToken}
    generate-token-nick-name: ${XIYU_CRM_GENERATE_TOKEN_NICK_NAME:}
    generate-token-sales-no: ${XIYU_CRM_GENERATE_TOKEN_SALES_NO:}
    auth:
      apply-token-path: ${XIYU_CRM_AUTH_APPLY_TOKEN_PATH:/auth/applyToken}
      oauth-login-path: ${XIYU_CRM_AUTH_OAUTH_LOGIN_PATH:/oauth/login}
      logout-path: ${XIYU_CRM_AUTH_LOGOUT_PATH:/oauth/logout}
      menu-tree-path: ${XIYU_CRM_AUTH_MENU_TREE_PATH:/menu/tree}
      employee-path: ${XIYU_CRM_AUTH_EMPLOYEE_PATH:/oauth/getUserInfo}
      user-permission-path: ${XIYU_CRM_AUTH_USER_PERMISSION_PATH:/oauth/getUserPermission}
      user-permission-system-name: ${XIYU_CRM_AUTH_USER_PERMISSION_SYSTEM_NAME:bid-platform}
      user-login-system: ${XIYU_CRM_USER_LOGIN_SYSTEM:bid-platform}
    customer:
      search-path: ${XIYU_CRM_CUSTOMER_SEARCH_PATH:/customer/search}
      contacts-path: ${XIYU_CRM_CUSTOMER_CONTACTS_PATH:/customer/contacts/batch}
    message:
      send-path: ${XIYU_CRM_MESSAGE_SEND_PATH:/common/sendMessage}
    matching-strategy: ${APP_CRM_MATCHING_STRATEGY:GROUP}
  bid-agent:
    upload-dir: ${BID_AGENT_UPLOAD_DIR:}
  export:
    max-records: ${APP_EXPORT_MAX_RECORDS:10000}  # Maximum records per export
    max-file-size-bytes: ${APP_EXPORT_MAX_SIZE:52428800}  # 50MB default
    audit-enabled: ${APP_EXPORT_AUDIT:true}
    max-exports-per-hour: ${APP_EXPORT_RATE_LIMIT:10}
    query-timeout-seconds: ${APP_EXPORT_QUERY_TIMEOUT:60}  # Maximum query execution time for exports
  tender-processing:
    storage-root: ${APP_TENDER_STORAGE_ROOT:/data/shared/tenders}
    max-global-concurrency: ${APP_TENDER_MAX_GLOBAL_CONCURRENCY:2}
    max-per-user-concurrency: ${APP_TENDER_MAX_PER_USER_CONCURRENCY:1}
    max-retries: ${APP_TENDER_MAX_RETRIES:3}
    retry-delays-minutes: ${APP_TENDER_RETRY_DELAYS:1,5,15}
    estimated-task-seconds: ${APP_TENDER_ESTIMATED_TASK_SECONDS:120}
    cpu-threshold: ${APP_TENDER_CPU_THRESHOLD:0.92}
    memory-threshold: ${APP_TENDER_MEMORY_THRESHOLD:0.92}
    worker-fixed-delay-ms: ${APP_TENDER_WORKER_DELAY_MS:5000}

xiyu:
  obs:
    enabled: ${XIYU_OBS_ENABLED:false}
    endpoint: ${XIYU_OBS_ENDPOINT:https://obs.cn-east-3.myhuaweicloud.com}
    region: ${XIYU_OBS_REGION:cn-east-3}
    bucket: ${XIYU_OBS_BUCKET:}
    access-key: ${XIYU_OBS_ACCESS_KEY:}
    secret-key: ${XIYU_OBS_SECRET_KEY:}
    agency-name: ${XIYU_OBS_AGENCY_NAME:}
    domain-name: ${XIYU_OBS_DOMAIN_NAME:}
    token-duration-seconds: ${XIYU_OBS_TOKEN_DURATION:3600}
    object-key-prefix: ${XIYU_OBS_OBJECT_KEY_PREFIX:bids}
    # 临时凭证允许的操作，逗号分隔
    allowed-actions: ${XIYU_OBS_ALLOWED_ACTIONS:obs:object:PutObject,obs:object:GetObject,obs:object:DeleteObject,obs:bucket:ListBucketMultipartUploads}
    # 下载预签名 URL 默认有效期（秒）
    download-url-expire-seconds: ${XIYU_OBS_DOWNLOAD_URL_EXPIRE:300}
    # 下载预签名 URL 使用的自定义域名（如 widbid-obs.ehsy.com）。
    # 用户在华为云 OBS 控制台为桶绑定的自定义域名，配置后 CRM 可直接通过该域名访问 OBS 文件。
    # 为空时退化为标准 OBS endpoint（obs.cn-east-3.myhuaweicloud.com）。
    download-custom-domain: ${XIYU_OBS_DOWNLOAD_CUSTOM_DOMAIN:}

  tender:
    abandon-roles: ${XIYU_TENDER_ABANDON_ROLES:ADMIN,MANAGER}
  integrations:
    organization:
      # 默认值与 OrganizationIntegrationProperties.java 保持一致
      # Java 默认 enabled=false（安全默认：避免意外同步），开发环境通过环境变量开启
      enabled: ${XIYU_ORG_SYNC_ENABLED:false}
      # webhook-secret removed — HTTP webhook path deleted per FR-012
      ip-whitelist: ${XIYU_ORG_IP_WHITELIST:}
      event-log-retention-days: ${XIYU_ORG_EVENT_LOG_RETENTION_DAYS:90}
      allowed-source-apps: ${XIYU_ORG_ALLOWED_SOURCE_APPS:oss,customer-org}
      # 未命中任何角色映射（人员/部门/岗位）的 OSS 用户是否跳过同步；已存在则禁用
      # 默认 true：白名单模式，只有命中下列映射规则的用户才会被同步到本地
      skip-unmapped-users: ${XIYU_ORG_SYNC_SKIP_UNMAPPED_USERS:true}
      # 管理员角色码（小写）；命中后允许提升为 ADMIN
      admin-role-codes:
        - admin
      # 经理角色码（注意：/bidAdmin 带前导斜杠，OSS 规范）
      manager-role-codes:
        - /bidAdmin
        - bid-TeamLeader
        - bid-SystemAdmin
      # person-to-role-mappings 已删除——人员白名单会覆盖 OSS 真实角色，导致 roleCode/menuPermissions 分裂。
      # 角色解析路径（勿混为一谈）：
      #   - 登录鉴权（OssRoleResolver）：sysRoleList.roleCode → roleName → jobName → fail-closed
      #   - 组织同步（JobRoleLookupResolver）：部门规则 → 岗位规则 → sysRoleList（仍保留 dept/position）
      # 登录菜单权限以 OSS getUserPermission 为准，不合并 catalog seed。
      # 按部门映射：通过部门名称正则匹配
      department-to-role-mappings:
        # 投标专员（按部门）：投标管理部
        - department-pattern: ".*投标管理部.*"
          role-code: bid-Team
        # 行政人员（按部门）：行政部
        - department-pattern: ".*行政部.*"
          role-code: bid-administration
      # 按岗位映射：通过岗位名称正则匹配
      position-to-role-mappings:
        # 投标项目负责人（按岗位）：项目经理、项目总监、主管、BD经理
        - position-pattern: ".*项目经理.*"
          role-code: bid-projectLeader
        - position-pattern: ".*项目总监.*"
          role-code: bid-projectLeader
        - position-pattern: ".*主管.*"
          role-code: bid-projectLeader
        - position-pattern: ".*BD经理.*"
          role-code: bid-projectLeader
      # 事件库 SDK：通过 Kafka 消费 BaseOssUser/BaseOssDept/BaseOssJob 三个 topic，实时同步本地 users 表
      # 生产环境通过 XIYU_ORG_EVENT_SDK_ENABLED=true 启用；本地默认 false 以避免无 Kafka 时启动失败
      # 启用后由 OrganizationEventSdkConsumerAdapter 自动消费并触发 OrganizationDirectorySyncAppService 同步
      event-sdk:
        enabled: ${XIYU_ORG_EVENT_SDK_ENABLED:false}
        consumer-group: ${XIYU_ORG_EVENT_CONSUMER_GROUP:bms}
      directory:
        # OSS 目录接口 base URL（测试环境默认值，生产环境必须通过环境变量覆盖）
        base-url: ${XIYU_ORG_DIRECTORY_BASE_URL:https://base-oss-test.ehsy.com}
        # YAPI 真实路径（POST + request body）
        # 详情接口：Content-Type=application/x-www-form-urlencoded，参数在 form body
        # 窗口接口：Content-Type=application/json，参数在 JSON body（startTime/endTime/index）
        user-detail-path: ${XIYU_ORG_DIRECTORY_USER_DETAIL_PATH:/subscription/msg/user}
        department-detail-path: ${XIYU_ORG_DIRECTORY_DEPARTMENT_DETAIL_PATH:/subscription/msg/dept}
        user-window-path: ${XIYU_ORG_DIRECTORY_USER_WINDOW_PATH:/subscription/msg/getUserByTimeWindow}
        department-window-path: ${XIYU_ORG_DIRECTORY_DEPARTMENT_WINDOW_PATH:/subscription/msg/getDeptByTimeWindow}
        job-detail-path: ${XIYU_ORG_DIRECTORY_JOB_DETAIL_PATH:/subscription/msg/job}
        batch-job-role-lookup-path: ${XIYU_ORG_DIRECTORY_BATCH_JOB_ROLE_LOOKUP_PATH:/oss/admin-web/v1/output/data/getUserJobListByJobNumberList}
        source-app: ${XIYU_ORG_DIRECTORY_SOURCE_APP:}
        trace-header-name: ${XIYU_ORG_DIRECTORY_TRACE_HEADER:EHSY-TraceID}
        source-header-name: ${XIYU_ORG_DIRECTORY_SOURCE_HEADER:EHSY-SRCAPP}
        auth-header-name: ${XIYU_ORG_DIRECTORY_AUTH_HEADER_NAME:}
        auth-token: ${XIYU_ORG_DIRECTORY_AUTH_TOKEN:}
        connect-timeout-ms: ${XIYU_ORG_DIRECTORY_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${XIYU_ORG_DIRECTORY_READ_TIMEOUT_MS:5000}
        user-menu-tree-path: ${XIYU_ORG_USER_MENU_TREE_PATH:/sysMenuUrl/getUserMenuTree}
        # OSS 菜单树查询 systemName，必须与登录接口的 system 标识一致
        user-menu-tree-system-name: ${XIYU_ORG_USER_MENU_TREE_SYSTEM_NAME:bid-platform}
        user-menu-tree-retrieval-type: ${XIYU_ORG_USER_MENU_TREE_RETRIEVAL_TYPE:2}
        user-menu-tree-job-number-param-name: ${XIYU_ORG_USER_MENU_TREE_JOB_NUMBER_PARAM_NAME:jobNumber}
        user-menu-tree-connect-timeout-ms: ${XIYU_ORG_USER_MENU_TREE_CONNECT_TIMEOUT_MS:3000}
        user-menu-tree-read-timeout-ms: ${XIYU_ORG_USER_MENU_TREE_READ_TIMEOUT_MS:5000}
        # OSS 菜单权限自动同步：组织架构同步时自动聚合用户菜单权限到角色
        auto-sync-menu-permissions: ${XIYU_ORG_AUTO_SYNC_MENU_PERMISSIONS:false}
        # OSS 菜单编码 -> 内部权限码列表映射（大小写不敏感）
        # OSS 用户登录后，OSS 返回的菜单码经此映射表转为内部权限键（菜单 key + 操作权限键），
        # 确保后端 @PreAuthorize(hasAuthority('xxx.manage')) 能正确放行。
        # 菜单 key（如 knowledge-qualification）供前端路由用，
        # 操作权限键（如 qualification.manage）供后端 @PreAuthorize 用。
        # CO-560: 系统盘点后一次性补全所有 catalog 中声明但 OSS 映射缺失的业务操作权限键，
        # 避免 OSS 用户在前端 hasPermission 检查中失败或未来加 @PreAuthorize 时重演 403 事故
        # （tender.view 因 OSS 缺映射已被迫回退为 hasAnyRole，见 TenderController.java:135）。
        menu-code-to-permission-key-mappings:
          "1001":
            - "dashboard"
            # CO-560: 工作台 widget 可见性 + 快速发起
            # 这些键控制 Workbench.vue 中的 widget 组件渲染（DynamicLayoutRenderer）
            # 以及工作台汇总数据加载（useWorkbenchMetrics.js）
            - "dashboard.quickStart"
            - "dashboard:view_welcome_banner"
            - "dashboard:view_metric_cards"
            - "dashboard:view_calendar"
            - "dashboard:view_tender_list"
            - "dashboard:view_technical_task"
            - "dashboard:view_review_list"
            - "dashboard:view_project_list"
            - "dashboard:view_active_projects"
            - "dashboard:view_team_task"
            - "dashboard:view_global_projects"
            - "dashboard:view_team_performance"
            - "dashboard:view_approval_list"
            - "dashboard:view_process_timeline"
            - "dashboard:view_activity_list"
            - "dashboard:view_priority_todos"
          "1002":
            - "bidding"
            # CO-560: 标讯中心业务操作权限键（前端 helpers.js 控制按钮可见性）
            - "bidding.manage"
            - "bidding.create"
            - "bidding.delete"
            - "bidding.sync"
            # tender.view 历史上因 OSS 缺映射被迫回退为 hasAnyRole（TenderController.java:135-139）
            # 补全后可恢复为 hasAuthority('tender.view')
            - "tender.view"
          "100201":
            - "bidding-list"
          "100202":
            - "bidding-list"
          "100203":
            - "bidding-list"
          "1003":
            - "project"
            # CO-560: 投标项目业务操作权限键
            # 原因：spec 032 修复 OSS 权限扩散后，OSS 用户 authorities 严格等于 OSS 菜单码映射出的内部权限键。
            # 但 OSS 菜单映射表中 1003 只映射到 ["project"]，导致所有 OSS 用户在以下场景失败：
            # - @PreAuthorize(hasAuthority('retrospective.submit')) 403（已被服务器日志铁证）
            # - 前端 hasPermission('project.create') 返回 false → 工作台"创建项目"按钮不显示
            # - 未来加 @PreAuthorize(hasAuthority('xxx')) 会重演 403 事故
            # 业务语义：这些都是项目流程的子环节，挂到 1003（投标项目）合理。
            # OSS 端按角色配置 1003 菜单：bid-projectLeader/bid-TeamLeader/bidAdmin/bid-Team 都配 1003，
            # 这些角色在 RoleProfileCatalog 中都持有对应权限键，映射对齐。
            - "project.create"
            - "project.view"
            - "evaluation.update"
            - "result.register"
            - "retrospective.submit"
            - "retrospective.review"
            - "closure.request"
            - "closure.review"
            - "lead.assign"
          "100301":
            - "project-list"
          "100302":
            - "project-list"
          "1004":
            - "knowledge"
          "100401":
            - "knowledge-archive"
          "100402":
            - "knowledge-qualification"
            - "qualification.manage"
            - "qualification.view"
            # CO-560: 资质证书管理（前端 useQualificationPage.js:29 isAdmin 判定）
            - "certificate.manage"
          "100403":
            - "knowledge-personnel"
            - "personnel.manage"
            - "personnel.view"
          "100404":
            - "knowledge-performance"
            - "performance.manage"
          "100405":
            - "knowledge-brand-auth"
            - "brand-auth.view"
            - "brand-auth.create"
            - "brand-auth.edit"
            - "brand-auth.revoke"
          "100406":
            - "knowledge-case"
          "100407":
            - "knowledge-template"
          "100408":
            - "knowledge-warehouse"
            - "warehouse.manage"
          "1005":
            - "resource"
            # CO-560: 保证金退还填写操作权限键（catalog 中 bid-projectLeader 持有）
            - "deposit.return.fill"
          "100501":
            - "resource-margin"
          "100502":
            - "resource-expense"
          "100503":
            - "resource-contract"
          "100504":
            - "resource-account"
          "100505":
            - "resource-ca"
          "100506":
            - "resource-bid-result"
          "100507":
            - "resource-bar"
          "1006":
            - "ai-center"
          "1007":
            # CO-560: catalog 用 "analytics"，OSS 此前只映射 "analytics-dashboard"
            # 两者是不同字符串，前端 useWorkbenchMetrics.js:47 / workbench-deadline-core.js:83
            # 使用 'analytics' 控制工作台汇总数据加载，OSS 用户缺此键导致汇总不显示
            - "analytics-dashboard"
            - "analytics"
          "1008":
            - "operation-logs"
          "1009":
            - "audit-logs"
          "1010":
            - "settings"
            - "system.admin"
            # CO-560: 告警规则子菜单权限键（router/index.js:331,337 + sidebar-menu.js:133,138）
            # 路由 meta 要求 ['settings', 'settings-alerts'] 全部命中（hasAllPermissions）
            - "settings-alerts"
          "101001":
            - "settings"
            - "system.admin"
            - "settings-alerts"
          "101002":
            - "settings"
            - "system.admin"
            - "settings-alerts"
          "101003":
            - "settings-workflow-forms"
            - "system.admin"
          "101004":
            - "settings"
            - "system.admin"
            - "settings-alerts"
          "101005":
            - "settings"
            - "system.admin"
            - "settings-alerts"
          "1011":
            - "task-board"
            # CO-560: 任务看板业务操作权限键
            # task.assign/review：前端 Workbench.vue:155 + useProjectDetailState.js:82 使用
            # task.view.own/handle.own：catalog 中 bid-Team/bid-otherDept 持有，防未来 @PreAuthorize
            - "task.assign"
            - "task.review"
            - "task.view.own"
            - "task.handle.own"
        # 未映射菜单编码处理：IGNORE 或 USE_NORMALIZED_CODE
        unmapped-menu-code-behavior: ${XIYU_ORG_UNMAPPED_MENU_BEHAVIOR:IGNORE}
      retry:
        enabled: ${XIYU_ORG_RETRY_ENABLED:true}
        max-attempts: ${XIYU_ORG_RETRY_MAX_ATTEMPTS:5}
        batch-size: ${XIYU_ORG_RETRY_BATCH_SIZE:50}
        fixed-delay-ms: ${XIYU_ORG_RETRY_FIXED_DELAY_MS:60000}
      reconciliation:
        enabled: ${XIYU_ORG_RECONCILIATION_ENABLED:false}
        cron: ${XIYU_ORG_RECONCILIATION_CRON:0 30 2 * * *}
        lookback-days: ${XIYU_ORG_RECONCILIATION_LOOKBACK_DAYS:3}


server:
  port: 8080
  # CO-524: 显式配置 Tomcat connection-timeout，避免默认 60s 与 nginx proxy_read_timeout 不一致
  # 当后端处理耗时 > 60s（如批量导入 180 行标讯 ~100s）时，Tomcat 主动断开连接导致 nginx 504
  tomcat:
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:180000}  # 3 分钟
  error:
    include-message: on_param
    include-binding-errors: on_param
    include-stacktrace: on_param  # 开发环境显示堆栈
  forward-headers-strategy: NATIVE  # 云平台自动处理转发头

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:1314,http://127.0.0.1:1314,http://localhost:1316,http://127.0.0.1:1316,http://localhost:1323,http://127.0.0.1:1323,http://localhost:5173,http://localhost:5174,http://localhost:3000}

client:
  register:
    serviceName: ${XIYU_ORG_EVENT_SERVICE_NAME:}
    serverRegisterUrl: ${XIYU_ORG_EVENT_SERVER_REGISTER_URL:}
    enableRegister: ${XIYU_ORG_EVENT_ENABLE_REGISTER:true}
  renewal:
    initialDelay: ${XIYU_ORG_EVENT_RENEWAL_INITIAL_DELAY:3}
    period: ${XIYU_ORG_EVENT_RENEWAL_PERIOD:3}
    renewalDuration: ${XIYU_ORG_EVENT_RENEWAL_DURATION_MS:3000}
broker:
  configure:
    serverList: ${XIYU_ORG_EVENT_BROKER_SERVER_LIST:}
    zkServers: ${XIYU_ORG_EVENT_BROKER_ZK_SERVERS:}
    env: ${XIYU_ORG_EVENT_BROKER_ENV:test}

rate:
  limit:
    # Default rate limits for unauthenticated/anonymous requests (external API)
    default:
      max: ${RATE_LIMIT_DEFAULT_MAX:100}
      window-seconds: ${RATE_LIMIT_DEFAULT_WINDOW:60}
    # Rate limits for API-key authenticated requests (external API)
    api-key:
      max: ${RATE_LIMIT_APIKEY_MAX:1000}
      window-seconds: ${RATE_LIMIT_APIKEY_WINDOW:60}
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
      window-minutes: ${RATE_LIMIT_LOGIN_WINDOW:15}
      lockout-minutes: ${RATE_LIMIT_LOGIN_LOCKOUT:30}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
    env:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

webhook:
  crm:
    # 4.1 标讯状态变更回调 - 回调到 CRM 系统 bidInfoSync 接口
    # 鉴权与访问 CRM 其他接口一致（Bearer JWT token，由 CrmAuthService 自动获取）
    # 生产环境必须通过 WEBHOOK_CRM_URL 显式注入；默认值为空避免误回调测试环境
    url: ${WEBHOOK_CRM_URL:}
    # 共享密钥；fail-closed —— 未设置或 header 不匹配时 /api/webhooks/crm/** 一律 401
    token: ${WEBHOOK_CRM_TOKEN:}

wecom:
  api:
    base-url: https://qyapi.weixin.qq.com
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  probe:
    mode: real

logging:
  level:
    com.xiyu: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.data.redis: WARN
    io.lettuce.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
# 注：原第二段 YAML 文档（rate.limit 重复定义）已移除
# 原因：与第一段 rate.limit 使用了不同的环境变量名，导致第一段的变量被覆盖
# 统一使用第一段的变量名：RATE_LIMIT_DEFAULT_MAX / RATE_LIMIT_LOGIN_MAX / RATE_LIMIT_APIKEY_MAX 等
